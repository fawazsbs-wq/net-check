<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>قياس سرعة الاتصال</title>
<meta name="referrer" content="no-referrer">
<style>
  :root { --bg:#EFE7D6; --card:#FBF8F1; --text:#2B2620; --muted:#6B6254; --accent:#1D6957; --line:rgba(43,38,32,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1b17; --card:#27241e; --text:#f1ece1; --muted:#b4ab9b; --accent:#58b79b; --line:rgba(241,236,225,.14); } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'El Messiri','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif; line-height:1.7; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:26px; margin:8px 0 4px; }
  p { margin:6px 0; color:var(--muted); font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:16px 0; }
  button { font:inherit; min-height:48px; padding:0 20px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:17px; cursor:pointer; width:100%; }
  button[disabled] { opacity:.55; cursor:default; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); margin-top:10px; }
  .row { display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .name { font-weight:700; }
  .sub { font-size:12.5px; color:var(--muted); }
  .ms { font-weight:800; font-variant-numeric:tabular-nums; direction:ltr; }
  .bar { grid-column:1 / -1; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  .best .name::after { content:" ✓ الأسرع"; color:var(--accent); font-size:12.5px; }
  .note { font-size:13px; }
  #status { min-height:24px; color:var(--muted); font-size:14px; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<main>
  <h1>قياس سرعة الاتصال</h1>
  <p>يقيس هذا الاختبار زمن وصول جوّالك إلى عدّة مناطق خوادم لنختار الأنسب. يستغرق نحو ٢٠ ثانية. تُسجَّل النتائج تلقائيًّا بلا أي بيانات شخصية، ويمكنك إعادة القياس أكثر من مرّة (تُسجَّل كل المحاولات).</p>
  <div class="card">
    <button id="go" type="button">ابدأ القياس</button>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <div class="card" id="result" hidden>
    <div id="rows"></div>
    <button class="ghost" id="copy" type="button">نسخ النتيجة (اختياري)</button>
    <p class="note" id="hint"></p>
  </div>
  <p class="note" id="saved"></p>
  <p class="note">الأرقام بالملّي ثانية؛ الأصغر أفضل. لا حاجة لإرسال شيء: النتيجة تصلنا تلقائيًّا.</p>
</main>
<script>
(function () {
  var REGIONS = [
    { id: "eu-west-1",    name: "أيرلندا",       sub: "الحالية" },
    { id: "eu-west-2",    name: "لندن",          sub: "متاحة في Supabase" },
    { id: "eu-west-3",    name: "باريس",         sub: "متاحة في Supabase" },
    { id: "eu-central-1", name: "فرانكفورت",     sub: "متاحة في Supabase" },
    { id: "eu-central-2", name: "زيورخ",         sub: "متاحة في Supabase" },
    { id: "eu-north-1",   name: "ستوكهولم",      sub: "متاحة في Supabase" },
    { id: "ap-south-1",   name: "مومباي",        sub: "متاحة في Supabase" },
    { id: "ap-southeast-1", name: "سنغافورة",    sub: "متاحة في Supabase" },
    { id: "me-central-1", name: "الإمارات",      sub: "للمقارنة فقط (غير متاحة في Supabase)" }
  ];
  var SAMPLES = 5;
  var go = document.getElementById("go"), statusEl = document.getElementById("status");
  var resultEl = document.getElementById("result"), rowsEl = document.getElementById("rows");
  var hintEl = document.getElementById("hint"), copyBtn = document.getElementById("copy");
  var last = null;
  var REPORT_URL = "https://mqwfrwfkigzixpfkuarj.supabase.co/functions/v1/speed-report";
  var savedEl = document.getElementById("saved");
  var runGroup = null, runNo = 0;
  try {
    runGroup = localStorage.getItem("sc_group");
    if (!runGroup) { runGroup = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("sc_group", runGroup); }
    runNo = Number(localStorage.getItem("sc_runs") || 0);
  } catch (e) { runGroup = Math.random().toString(36).slice(2); }

  function report() {
    runNo += 1;
    try { localStorage.setItem("sc_runs", String(runNo)); } catch (e) {}
    var c = navigator.connection || {};
    var payload = {
      run_group: runGroup, run_no: runNo, net_type: c.effectiveType || c.type || null,
      tz: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e) { return null; } })(),
      lang: navigator.language || null,
      results: last.map(function (r) { return { id: r.id, name: r.name, ms: r.ms }; })
    };
    savedEl.textContent = "جارٍ تسجيل النتيجة…";
    fetch(REPORT_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) { savedEl.textContent = x.ok ? "تم تسجيل النتيجة ✓ (المحاولة رقم " + runNo + ")" : "تعذّر تسجيل النتيجة تلقائيًّا — اضغط «نسخ النتيجة» وأرسلها لنا."; })
      .catch(function () { savedEl.textContent = "تعذّر تسجيل النتيجة تلقائيًّا — اضغط «نسخ النتيجة» وأرسلها لنا."; });
  }

  function ping(url) {
    var t0 = performance.now();
    return fetch(url + "?t=" + Math.random().toString(36).slice(2), { mode: "no-cors", cache: "no-store" })
      .then(function () { return performance.now() - t0; });
  }
  function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }); return s[Math.floor(s.length / 2)]; }

  async function measure(region) {
    var url = "https://dynamodb." + region.id + ".amazonaws.com/ping";
    try { await ping(url); } catch (e) { return null; }          // اتصال أول (يشمل TLS) يُهمَل
    var xs = [];
    for (var i = 0; i < SAMPLES; i++) { try { xs.push(await ping(url)); } catch (e) {} }
    return xs.length ? Math.round(median(xs)) : null;
  }

  go.addEventListener("click", async function () {
    go.disabled = true; resultEl.hidden = true; last = [];
    for (var i = 0; i < REGIONS.length; i++) {
      statusEl.textContent = "جارٍ قياس: " + REGIONS[i].name + " (" + (i + 1) + "/" + REGIONS.length + ")";
      var ms = await measure(REGIONS[i]);
      last.push({ id: REGIONS[i].id, name: REGIONS[i].name, sub: REGIONS[i].sub, ms: ms });
    }
    render();
    report();
    statusEl.textContent = "اكتمل القياس";
    go.disabled = false; go.textContent = "أعد القياس";
  });

  function render() {
    var ok = last.filter(function (r) { return r.ms != null; }).sort(function (a, b) { return a.ms - b.ms; });
    var max = ok.length ? ok[ok.length - 1].ms : 1;
    rowsEl.textContent = "";
    var supa = ok.filter(function (r) { return r.id !== "me-central-1"; });
    var bestId = supa.length ? supa[0].id : null;
    ok.forEach(function (r) {
      var row = document.createElement("div"); row.className = "row" + (r.id === bestId ? " best" : "");
      var left = document.createElement("div");
      var n = document.createElement("div"); n.className = "name"; n.textContent = r.name;
      var s = document.createElement("div"); s.className = "sub"; s.textContent = r.sub;
      left.appendChild(n); left.appendChild(s);
      var v = document.createElement("div"); v.className = "ms"; v.textContent = r.ms + " ms";
      var bar = document.createElement("div"); bar.className = "bar";
      var i = document.createElement("i"); i.style.width = Math.max(4, Math.round(r.ms / max * 100)) + "%"; bar.appendChild(i);
      row.appendChild(left); row.appendChild(v); row.appendChild(bar);
      rowsEl.appendChild(row);
    });
    var failed = last.filter(function (r) { return r.ms == null; });
    hintEl.textContent = failed.length ? "تعذّر قياس: " + failed.map(function (r) { return r.name; }).join("، ") + " (شبكتك تحجبها أو أن الاتصال انقطع)." : "";
    resultEl.hidden = false;
  }

  copyBtn.addEventListener("click", function () {
    var lines = ["قياس فهرس — " + new Date().toLocaleString("ar")].concat(last.map(function (r) {
      return r.name + " (" + r.id + "): " + (r.ms == null ? "—" : r.ms + "ms");
    }));
    var text = lines.join("\n");
    function done() { copyBtn.textContent = "تم النسخ ✓"; setTimeout(function () { copyBtn.textContent = "نسخ النتيجة (اختياري)"; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { window.prompt("انسخ النتيجة:", text); });
    else window.prompt("انسخ النتيجة:", text);
  });
})();
</script>
</body>
</html>
